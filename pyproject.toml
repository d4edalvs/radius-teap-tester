[project]
name = "teap-tester"
version = "1.0.0"
description = "CLI TEAP (EAP type 55) client with EAP chaining for RADIUS testing"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # 24.3 is the first to accept cryptography certificates and keys directly.
    "pyopenssl>=24.3",
    # 43 is the first release with hazmat.decrepit, where MS-CHAPv2's DES lives.
    "cryptography>=43.0",
]

[project.optional-dependencies]
gui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown>=3.5",
]

[project.scripts]
teap-tester = "teap_tester.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teap_tester", "teap_gui"]
