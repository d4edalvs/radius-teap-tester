<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TEAP Tester{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <style>
    body { padding-top: 4.5rem; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
    .timeline { max-height: 60vh; overflow-y: auto; }
    .wiki { max-width: 52rem; line-height: 1.6; }
    .wiki h1 { font-size: 1.6rem; margin-bottom: 1rem; }
    .wiki h2 { font-size: 1.25rem; margin-top: 2rem; margin-bottom: .6rem;
               padding-bottom: .3rem; border-bottom: 1px solid var(--bs-border-color); }
    .wiki h3 { font-size: 1.05rem; margin-top: 1.5rem; }
    .wiki table { width: 100%; margin: 1rem 0; font-size: .9rem; }
    .wiki th, .wiki td { padding: .4rem .6rem; border-bottom: 1px solid var(--bs-border-color); }
    .wiki th { text-align: left; background: var(--bs-tertiary-bg); }
    .wiki code { background: var(--bs-tertiary-bg); padding: .1rem .3rem; border-radius: .2rem; }
    .wiki ul, .wiki ol { margin-bottom: 1rem; }
    .wiki li { margin-bottom: .3rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand" href="/generate">TEAP&nbsp;Tester</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        {% for slug, label in [('sessions','Sessions'), ('generate','Generate'), ('jobs','Jobs'),
                               ('certificates','Certificates'), ('wiki','Wiki'),
                               ('servers','Servers')] %}
        <li class="nav-item">
          <a class="nav-link {% if active == slug %}active fw-semibold{% endif %}"
             href="/{{ slug }}">{{ label }}</a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
<main class="container-fluid px-4">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
