<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TEAP Tester{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="/static/app.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
</head>
<body>
<aside class="rail">
  <a class="rail-mark text-decoration-none" href="/generate">
    <b>teap tester</b><span>EAP type 55 · RFC 9930</span>
  </a>
  <nav>
    {% for slug, label in [('generate','Generate'), ('sessions','Sessions'),
                           ('jobs','Jobs'), ('certificates','Certificates'),
                           ('servers','Servers'), ('wiki','Wiki')] %}
    <a href="/{{ slug }}" {% if active == slug %}class="on"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>
  <div class="rail-foot">EAP chaining · crypto-binding</div>
</aside>
<main>
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// When a note's ring closes, fade it and take it out of the page.
document.querySelectorAll('.note-auto').forEach(function (note) {
  note.querySelector('.note-ring-fill').addEventListener('animationend', function () {
    note.classList.add('note-gone');
    setTimeout(function () { note.remove(); }, 400);
  });
});
// A note reports one action; reloading the page must not report it again.
try {
  var here = new URL(location.href);
  if (here.searchParams.has('note')) {
    here.searchParams.delete('note');
    history.replaceState(null, '', here);
  }
} catch (e) {}
</script>
</body>
</html>
