# For creating migrations; the app applies them itself at startup.
#
#   alembic -c teap_gui/alembic.ini revision --autogenerate -m "what changed"
#
# Point TEAP_GUI_DATA (or DATABASE_URL) at a database that is at the current
# head first, so autogenerate diffs the models against the latest schema.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
